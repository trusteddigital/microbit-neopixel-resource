<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>micro:bit NeoPixel 8x8 Designer</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>micro:bit designer</h1>
      <p class="subheading">
        Design a pattern for an 8×8 NeoPixel matrix on <code>pin0</code>, then push it to a connected micro:bit.
      </p>

      <section class="toolbar" aria-label="Drawing tools">
        <label>
          Paint color
          <input type="color" id="paint-color" value="#00ffcc" />
        </label>
        <button id="draw-mode" class="active">Draw</button>
        <button id="erase-mode">Erase</button>
        <button id="fill-grid">Fill</button>
        <button id="clear-grid">Clear</button>
        <button id="import-image" type="button">📷 Import Image</button>
        <input id="image-file-input" type="file" accept="image/*" style="display:none" />
        <span class="toolbar-divider">or</span>
        <div class="preset-group">
          <button id="preset-christmas" class="preset-btn" title="Christmas Tree">🎄</button>
          <button id="preset-rainbow"   class="preset-btn" title="Rainbow">🌈</button>
          <button id="preset-pacman"    class="preset-btn" title="Pac-Man">👾</button>
          <button id="preset-mario"     class="preset-btn" title="Mario">🍄</button>
          <button id="preset-pattern"   class="preset-btn" title="Pattern">✨</button>
        </div>
      </section>

      <section class="panel">
        <div id="grid" class="grid" role="grid" aria-label="NeoPixel 8 by 8 editor"></div>
        <aside class="controls">
          <div class="connect-group">
            <button id="connect-usb">🔌 Connect USB</button>
            <button id="connect-bluetooth">📡 Connect Bluetooth</button>
          </div>
          <button id="push-button" disabled>Push to micro:bit</button>
          <p id="status" aria-live="polite">Status: waiting for connection.</p>

          <details>
            <summary>Generated MicroPython preview</summary>
            <pre id="python-preview"></pre>
          </details>
        </aside>
      </section>
    </main>
  </body>
</html>
