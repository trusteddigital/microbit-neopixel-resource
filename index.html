<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>micro:bit NeoPixel 8x8 Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>

      <section class="workspace">
        <div class="tv">
          <div class="tv-cabinet">
            <div class="tv-screen-frame">
              <div class="tv-screen">
                <div id="grid" class="grid" role="grid" aria-label="NeoPixel 8 by 8 editor"></div>
                <div class="screen-glare" aria-hidden="true"></div>
                <div class="screen-scanlines" aria-hidden="true"></div>
              </div>
            </div>
            <div class="tv-panel">
              <span class="tv-brand">RGS&middot;TV</span>
              <span class="tv-led" title="Power"></span>
              <span class="tv-knob"></span>
              <span class="tv-knob"></span>
              <span class="tv-speaker" aria-hidden="true"></span>
            </div>
          </div>
          <div class="tv-stand" aria-hidden="true"></div>
        </div>

        <aside class="controls">
          <img src="stem-horizons.svg" alt="STEM Horizons" class="site-logo" />
      
          <div class="tool-block">
            <span class="tool-label">Colour</span>
            <div class="color-row">
              <input type="color" id="paint-color" value="#FFFFFF" />
              <div id="recent-colors" class="recent-colors" aria-label="Recent colours"></div>
            </div>
          </div>

          <div class="tool-block">
            <div class="btn-row">
              <button id="fill-grid" type="button">Fill</button>
              <button id="clear-grid" type="button">Clear</button>
              <!--<button id="import-image" type="button">Import image</button>
              <input id="image-file-input" type="file" accept="image/*" hidden />-->
            </div>
          </div>

          
          <!--<div class="tool-block">
            <span class="tool-label">Presets</span>
            <div class="preset-group">
              <button id="preset-christmas" class="preset-btn" type="button" title="Christmas Tree">🎄</button>
              <button id="preset-rainbow"   class="preset-btn" type="button" title="Rainbow">🌈</button>
              <button id="preset-pacman"    class="preset-btn" type="button" title="Pac-Man">👾</button>
              <button id="preset-mario"     class="preset-btn" type="button" title="Mario">🍄</button>
              <button id="preset-pattern"   class="preset-btn" type="button" title="Pattern">✨</button>
            </div>
          </div>
-->
          <p class="paint-hint">Left-click to paint · Right-click to erase</p>

          <hr class="controls-divider" />

          <div class="connect-group">
            <button id="connect-usb" type="button">Connect USB</button>
            <button id="connect-bluetooth" type="button">Connect Bluetooth</button>
          </div>
          <button id="push-button" class="push-btn" type="button" disabled>Push to micro:bit</button>
          <p id="status" aria-live="polite">Status: waiting for connection.</p>

          <details class="preview">
            <summary>MicroPython preview</summary>
            <pre id="python-preview"></pre>
          </details>
        </aside>
      </section>
    </main>
  </body>
</html>
